[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowit"
version = "0.1.0"
description = "Tag-based note browser powered by fzf and bat"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "onepassword-sdk",
]

[project.scripts]
knowit = "knowit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowit*"]
